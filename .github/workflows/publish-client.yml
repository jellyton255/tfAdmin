name: Publish API client

on:
  push:
    tags:
      - "client-v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    name: Build and release @everfall/txadmin-client
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches client/package.json
        run: |
          PKG_VERSION=$(node -p "require('./client/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#client-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match client/package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Build and pack
        run: |
          pnpm --filter @everfall/txadmin-client build
          cd client
          pnpm pack --out ../txadmin-client.tgz
          cd ..
          sha256sum txadmin-client.tgz

      - name: Create GitHub release with the tarball
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            `@everfall/txadmin-client` ${{ github.ref_name }}. Install from this release without a registry:

            ```sh
            pnpm add https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/txadmin-client.tgz
            ```
          files: txadmin-client.tgz

      - name: Publish to npm (when NPM_TOKEN is configured)
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: pnpm --filter @everfall/txadmin-client publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
